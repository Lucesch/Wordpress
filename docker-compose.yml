services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/portal
    ports:
      - "3000:3000"
volumes:
  mongo-data:
